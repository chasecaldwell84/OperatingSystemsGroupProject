services:
  workbench:
    build: .
    image: os-workbench
    volumes:
      - .:/workspace        # edit on your host, build/run in the container
    stdin_open: true
    tty: true
    shm_size: "1gb"         # MPI shared-memory transport needs room
    # cpus: "8"             # uncomment to cap cores for repeatable timings
